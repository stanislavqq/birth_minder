name: Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DEPLOY_PATH: /app/bminder
  BUILD_PATH: bin
  BUILD_APP_NAME: bminder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true

      - name: Build
        run: go mod download && CGO_ENABLED=0 go build -o bin/bminder cmd/birth_minder/main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: bin
          archive: false

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Download build files
        uses: actions/download-artifact@v7
        id: test
        with:
          name: build-files
          path: dist

      - name: Deploy to prod server
        uses: appleboy/scp-action@v1
        with:
          key: ${{ secrets.SSH_SECRET_KEY }}
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          overwrite: true
          source: dist/*
          target: /app/bminder/bin/

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          key: ${{ secrets.SSH_SECRET_KEY }}
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          script: |
            sudo systemctl restart bminder.service