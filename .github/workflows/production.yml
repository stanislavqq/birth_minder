name: Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DEPLOY_PATH: /app/bminder
  BUILD_PATH: bin
  BUILD_APP_NAME: bminder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true

      - name: Build
        run: go mod download && CGO_ENABLED=1 go build -o bin/bminder cmd/birth_minder/main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: bin
#          archive: false

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Download build files
        uses: actions/download-artifact@v7
        id: test
        with:
          name: build-files
          path: .

      - name: Deploy to prod server
        uses: appleboy/scp-action@v1
        with:
          key: ${{ secrets.SSH_SECRET_KEY }}
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          overwrite: true
          source: "./bminder,config.dist"
          target: /app/bminder/bin/upd

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          key: ${{ secrets.SSH_SECRET_KEY }}
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          script: |
            mv /app/bminder/bin/upd/config.dist /app/bminder/config.yml
            touch /app/bminder/.env
            echo TG_CHAT_ID=${{ secrets.TG_CHAT_ID }} > /app/bminder/.env
            echo TG_TOKEN=${{ secrets.TG_TOKEN }} >> /app/bminder/.env
            echo SQLITE_PATH=${{ secrets.SQLITE_PATH }} >> /app/bminder/.env
            echo SCHEDULE_RULE=${{ vars.SCHEDULE_RULE }} >> /app/bminder/.env
            sudo /bin/bash /app/bminder/update.sh