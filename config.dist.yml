debug: ${DEBUG_MODE|false}
formatMessage: "🎂 ДР {fullname} | {soon_time} \n\n📆 {date}"

cronRule: ${SCHEDULE_RULE}

database:
  migrations: migrations
  driver: mysql
  mysql:
    enabled: true
    host: ${DB_HOST}
    name: ${DB_NAME}
    port: ${DB_PORT}
    user: ${DB_USER}
    password: ${DB_PASS}
    sslmode: disable
  sqlite:
    enabled: true
    path: ${SQLITE_PATH}

tgbot:
  token: ${TG_TOKEN}
  notifyChat: ${TG_CHAT_ID}