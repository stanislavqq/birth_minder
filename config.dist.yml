debug: ${DEBUG_MODE|false}
formatMessage: ${FORMAT_MESSAGE}

cronRule: "0 10 * * *"

database:
  enabled: true
  host: ${DB_HOST}
  name: ${DB_NAME}
  port: ${DB_PORT}
  user: ${DB_USER}
  password: ${DB_PASS}
  migrations: migrations
  sslmode: disable
  driver: postgres

tgbot:
  token: ${TG_TOKEN}
  notifyChat: ${TG_CHAT_ID}